name: CD

on:
  push:
    tags:
        - "v" 
  workflow_dispatch:           

permissions:
  contents: read
  packages: write          

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/api:latest

  deploy:
    needs: build-and-push      # attend la fin du job précédent
    runs-on: ubuntu-latest
    environment: production    # permet une approbation manuelle et des secrets dédiés
    steps:
      - name: Deploy
        run: 
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}